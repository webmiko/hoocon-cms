name: hoocon_manager
description: Hoocon manager app (internal) — leads, CRM, support chat.
publish_to: "none"
version: 0.1.3+4

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  go_router: ^15.1.2
  flutter_riverpod: ^2.6.1
  intl: ^0.20.2
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  flutter_local_notifications: ^22.3.0
  # Push: add firebase_core / firebase_messaging / flutter_local_notifications
  # after GoogleService-Info.plist + google-services.json are in place.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
