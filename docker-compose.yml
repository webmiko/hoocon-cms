services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hoocon}
      POSTGRES_USER: ${DB_USER:-hoocon}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hoocon_local_dev}
    # 5432 — Homebrew Postgres, 5433 — другой локальный проект, 5452 — Postgres.app.
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hoocon} -d ${DB_NAME:-hoocon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # 6379 — Homebrew Redis, 6380 — другой локальный проект.
    ports:
      - "127.0.0.1:6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
