# Nginx site for Hoocon CMS (frontend dist + API proxy + redirects map).
# Spec: ПЛАН §6 Iter 1 — deploy/nginx/ stub (spa.conf + redirects.map заготовка);
# docs/security-baseline.md §3.3 (TLS, CSP, headers); docs/seo-url-migration.md
# (redirects.map from Redirect model — Iter 5).
#
# STUB: этот файл — заготовка для итерации 5 (prod hardening). До cutover
# правки не требуются; структура зафиксирована, чтобы разработка SPA (Iter 4)
# и Redirect → nginx map (Iter 5) знали целевую форму.
#
# Установка на VPS (Iter 5):
#   sudo cp deploy/nginx/hoocon.conf /etc/nginx/sites-available/hoocon
#   sudo ln -s /etc/nginx/sites-available/hoocon /etc/nginx/sites-enabled/hoocon
#   sudo nginx -t && sudo systemctl reload nginx

# Rate limit zones (anti-abuse; tuned in Iter 5).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=lead_limit:10m rate=10r/m;
limit_req_status 429;

# Upstream to Django (gunicorn on localhost:8000; or docker network in Compose).
upstream hoocon_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name _;

    # Redirect all HTTP -> HTTPS in prod (Iter 5; commented for local dev).
    # return 301 https://$host$request_uri;

    client_max_body_size 20M;  # matches MAX_PRODUCT_FILE_SIZE_BYTES (PDF upload)

    # Frontend SPA root (built in Iter 4; stub for now).
    root /var/www/hoocon/frontend/dist;
    index index.html;

    # Security headers (CSP tightened in Iter 5; baseline now).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP draft — tightened to object-src 'none', frame-ancestors 'none' in Iter 5.
    # add_header Content-Security-Policy "default-src 'self'; object-src 'none'; frame-ancestors 'none';" always;

    # Redirects map (from Redirect model — Iter 5; stub placeholder).
    # Generated by scripts/export_redirects_map.sh (Iter 5):
    #   /tproduct/123-bv215  /sharovoy-kran-bv215;
    # include /etc/nginx/redirects.map;

    # API proxy → Django (gunicorn).
    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://hoocon_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Lead submission — stricter rate limit (Iter 3 throttle + nginx backstop).
    location /api/leads/ {
        limit_req zone=lead_limit burst=3 nodelay;
        proxy_pass http://hoocon_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django Admin — IP allowlist (Iter 5; see admin-allow.conf.example).
    location /admin/ {
        # include /etc/nginx/admin-allow.conf;  # Iter 5
        proxy_pass http://hoocon_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Media (uploaded PDF/images) — no directory listing, no script execution.
    # Hotlink: allow empty Referer (direct open / mail) + our hosts; deny foreign embeds.
    # Keep host list in sync with DJANGO_ALLOWED_HOSTS / MEDIA_HOTLINK_EXTRA_HOSTS.
    location /media/ {
        valid_referers
            none
            blocked
            server_names
            hoocon.ru
            *.hoocon.ru
            localhost
            127.0.0.1
            ~(?i)^https?://(localhost|127\.0\.0\.1)(:[0-9]+)?(/|$)
            ~(?i)^https?://([^/]+\.)?hoocon\.ru(:[0-9]+)?(/|$);

        if ($invalid_referer) {
            return 403;
        }

        autoindex off;
        alias /var/www/hoocon/media/;
        add_header X-Content-Type-Options "nosniff" always;
        # PDF inline viewing allowed; no inline scripts.
        add_header Content-Disposition "inline";
    }

    # Static (collectstatic) — long cache.
    location /static/ {
        alias /var/www/hoocon/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # robots / sitemap / llms from Django.
    location = /robots.txt {
        proxy_pass http://hoocon_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /sitemap.xml {
        proxy_pass http://hoocon_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location = /llms.txt {
        proxy_pass http://hoocon_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: canonical without trailing slash; /index.html → /; HTML via Django SEO head.
    location = /index.html {
        return 301 /$is_args$args;
    }

    location / {
        rewrite ^/(.*)/$ /$1 permanent;
        try_files $uri @spa;
    }

    location @spa {
        proxy_pass http://hoocon_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
