# Nginx site for Hoocon CMS (frontend dist + API proxy + redirects map).
# Spec: ПЛАН §6 Iter 1 — deploy/nginx/ stub (spa.conf + redirects.map заготовка);
# docs/security-baseline.md §3.3 (TLS, CSP, headers); docs/seo-url-migration.md
# (redirects.map from Redirect model — Iter 5).
#
# Prod: Let's Encrypt on hoocon.ru (+ www → apex). HSTS deferred until stable.
# Deploy applies this file via scripts/deploy-remote.sh → /etc/nginx/sites-available/hoocon.
#
# Manual:
#   sudo cp deploy/nginx/hoocon.conf /etc/nginx/sites-available/hoocon
#   sudo cp deploy/nginx/hoocon-site.inc /etc/nginx/hoocon-site.inc
#   sudo ln -sfn /etc/nginx/sites-available/hoocon /etc/nginx/sites-enabled/hoocon
#   sudo nginx -t && sudo systemctl reload nginx
# Cert:
#   sudo certbot certonly --nginx -d hoocon.ru -d www.hoocon.ru

# Rate limit zones (anti-abuse; tuned in Iter 5).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=lead_limit:10m rate=10r/m;
limit_req_status 429;

# Upstream to Django (gunicorn on localhost:8000; or docker network in Compose).
upstream hoocon_app {
    server 127.0.0.1:8000;
}

# SEO 301 map from Redirect model (~5k rules) — enlarge hash for long paths.
map_hash_bucket_size 256;
map_hash_max_size 16384;
map $uri $hoocon_redirect {
    include /etc/nginx/redirects.map;
    default "";
}

# HTTP → HTTPS (apex). Keep ACME on :80 for renewals.
server {
    listen 80;
    listen [::]:80;
    server_name hoocon.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://hoocon.ru$request_uri;
    }
}

# www HTTP → HTTPS apex (seo-url-migration.md).
server {
    listen 80;
    listen [::]:80;
    server_name www.hoocon.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://hoocon.ru$request_uri;
    }
}

# Break-glass HTTP by IP (no LE name for bare IP).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 161.104.19.49 _;

    include /etc/nginx/hoocon-site.inc;
}

# HTTPS apex — primary public site.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hoocon.ru;

    ssl_certificate /etc/letsencrypt/live/hoocon.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hoocon.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/hoocon-site.inc;
}

# www HTTPS → apex.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.hoocon.ru;

    ssl_certificate /etc/letsencrypt/live/hoocon.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hoocon.ru/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://hoocon.ru$request_uri;
}
