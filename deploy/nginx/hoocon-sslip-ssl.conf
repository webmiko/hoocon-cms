# Temporary HTTPS for Telegram webhook until apex DNS cutover to VPS.
# Deploy installs this alongside hoocon.conf (not overwritten into the main site).
#
# Placeholder domain (RFC 5737 TEST-NET-3). On VPS set VPS_SSLIP_DOMAIN in .env;
# deploy-remote.sh substitutes it when copying this file.
# Cert: certbot certonly --nginx -d <VPS_IP>.sslip.io
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 203.0.113.10.sslip.io;

    ssl_certificate /etc/letsencrypt/live/203.0.113.10.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/203.0.113.10.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location /api/ {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://hoocon_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name 203.0.113.10.sslip.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
