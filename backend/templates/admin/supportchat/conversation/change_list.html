{% extends "admin/change_list.html" %}
{% load static %}

{% block object-tools-items %}
  <li>
    <a href="#" id="hoocon-webpush-enable" class="viewlink">Push в браузер</a>
  </li>
  <li><span id="hoocon-webpush-status" style="margin-left:0.5rem;opacity:0.8;"></span></li>
  {{ block.super }}
{% endblock %}

{% block extrahead %}
  {{ block.super }}
  <link rel="stylesheet"
    href="{% static 'admin/css/hoocon-support-messenger.css' %}?v={{ STATIC_VERSION }}">
  <script src="{% static 'admin/js/hoocon-admin-webpush.js' %}?v={{ STATIC_VERSION }}" defer></script>
  <script>
    (function () {
      var unreadUrl = "{% url 'admin:supportchat_conversation_unread_count' %}";
      var baseline = null;
      var reloading = false;
      async function tick() {
        if (document.hidden || reloading) return;
        try {
          var resp = await fetch(unreadUrl, {
            credentials: "same-origin",
            headers: { Accept: "application/json" },
            cache: "no-store",
          });
          if (!resp.ok) return;
          var data = await resp.json();
          var count = Number(data.count) || 0;
          if (baseline === null) {
            baseline = count;
            return;
          }
          if (count <= baseline) return;
          baseline = count;
          // Soft-reload list so new threads appear without a manual F5.
          reloading = true;
          var banner = document.querySelector(".hoocon-messenger__live-banner");
          if (!banner) {
            banner = document.createElement("div");
            banner.className = "hoocon-messenger__live-banner";
            banner.setAttribute("role", "status");
            banner.textContent = "Обновляем список…";
            var host =
              document.querySelector("#content-main") ||
              document.querySelector("#content") ||
              document.body;
            host.insertBefore(banner, host.firstChild);
          }
          window.setTimeout(function () {
            location.reload();
          }, 400);
        } catch (e) {
          /* ignore */
        }
      }
      document.addEventListener("DOMContentLoaded", function () {
        void tick();
        window.setInterval(function () {
          void tick();
        }, 5000);
        document.addEventListener("visibilitychange", function () {
          if (!document.hidden) void tick();
        });
      });
    })();
  </script>
{% endblock %}
