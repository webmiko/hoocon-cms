{% load i18n static %}
{# Shared passkey login CTA for classic + OTP login pages. #}
{% if admin_passkey_enabled %}
  <div
    id="hoocon-passkey-root"
    class="mt-8"
    data-login-begin="{{ passkey_login_begin_url }}"
    data-login-complete="{{ passkey_login_complete_url }}"
    data-next="{{ next|default:'/admin/' }}"
  >
    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center" aria-hidden="true">
        <div class="w-full border-t border-base-200 dark:border-base-700"></div>
      </div>
      <div class="relative flex justify-center text-xs">
        <span class="bg-white dark:bg-base-900 px-2 text-font-subtle-light dark:text-font-subtle-dark">
          или
        </span>
      </div>
    </div>

    <button
      type="button"
      data-passkey-login
      class="group relative w-full inline-flex items-center justify-center gap-2 rounded font-medium px-3 py-2 bg-transparent border border-base-200 dark:border-base-700 text-font-default-light dark:text-font-default-dark hover:bg-base-50 dark:hover:bg-base-800"
    >
      <span class="material-symbols-outlined text-base">fingerprint</span>
      Войти с ключом доступа
    </button>
    <p class="mt-2 text-xs text-font-subtle-light dark:text-font-subtle-dark">
      Связка ключей (Mac) или Google Password Manager
    </p>
    <p
      data-passkey-status
      class="mt-3 text-sm text-font-subtle-light dark:text-font-subtle-dark"
      hidden
    ></p>
  </div>
  <script src="{% static 'admin/js/hoocon-admin-passkeys.js' %}?v={{ STATIC_VERSION }}" defer></script>
{% endif %}
