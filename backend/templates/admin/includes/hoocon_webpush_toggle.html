{# Staff Web Push toggle — заявки + чат (shared markup; class, not unique id). #}
<button
  type="button"
  class="hoocon-admin-push-toggle"
  role="switch"
  aria-checked="false"
  aria-label="Push выключен — нажмите, чтобы включить заявки и чат"
  title="Push выключен"
  data-state="off"
>
  <span class="material-symbols-outlined hoocon-admin-push-toggle__icon" aria-hidden="true"
    >notifications</span
  >
  <span class="hoocon-admin-push-toggle__track" aria-hidden="true">
    <span class="hoocon-admin-push-toggle__knob"></span>
  </span>
</button>
