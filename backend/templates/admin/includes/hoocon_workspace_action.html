{% if action.post %}
<form method="post" action="{{ action.url }}" class="hoocon-ws__form">
  {% csrf_token %}
  <button type="submit" class="hoocon-ws__btn hoocon-ws__btn--{{ kind }}">{{ action.label }}</button>
</form>
{% else %}
<a class="hoocon-ws__btn hoocon-ws__btn--{{ kind }}" href="{{ action.url }}">{{ action.label }}</a>
{% endif %}
