{% load i18n unfold %}

{# Desktop (≥1024): macOS 27 Settings sidebar (full width). Mobile: overlay. #}
<div
    class="hoocon-nav-shell hoocon-os27-sidebar relative z-60 shrink-0"
    x-bind:class="{ 'hoocon-nav-shell--open': sidebarOpen }"
    x-data="{
        sidebarWidth: 260,
        isDesktopNav() { return window.innerWidth >= 1024; },
        panelWidth() {
            if (this.isDesktopNav()) {
                return this.sidebarWidth;
            }
            const raw = Number(this.sidebarWidth) || 288;
            return Math.min(360, Math.max(260, raw));
        },
    }"
>
    <div
        id="nav-sidebar"
        class="hoocon-nav-panel hoocon-os27-sidebar-panel bg-base-50 border-r border-base-200 dark:border-base-800 dark:bg-base-900 {% element_classes 'navigation' %}"
        x-bind:style="`width: ${panelWidth()}px`"
    >
        {% if templates.navigation %}
            {% include templates.navigation %}
        {% else %}
            {% include "unfold/helpers/navigation.html" %}
        {% endif %}
    </div>
</div>
