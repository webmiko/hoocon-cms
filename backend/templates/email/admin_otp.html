<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site_name }}</title>
</head>
<body style="margin:0;padding:0;background:#f4f6f8;font-family:system-ui,-apple-system,sans-serif;color:#1a2332;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f4f6f8;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0"
               style="max-width:520px;background:#ffffff;border-radius:16px;padding:32px 28px;">
          <tr>
            <td style="font-size:20px;font-weight:600;padding-bottom:16px;color:#c8102e;">
              {{ site_name }}
            </td>
          </tr>
          <tr>
            <td style="font-size:16px;line-height:1.55;padding-bottom:20px;">
              {{ intro }}
            </td>
          </tr>
          <tr>
            <td style="padding-bottom:24px;text-align:center;">
              <span style="display:inline-block;font-size:32px;font-weight:700;letter-spacing:0.35em;
                           color:#1a2332;background:#f4f6f8;padding:14px 18px;border-radius:12px;">
                {{ code }}
              </span>
            </td>
          </tr>
          <tr>
            <td style="font-size:13px;line-height:1.5;color:#5c6773;padding-bottom:16px;">
              {{ footer }}
            </td>
          </tr>
          <tr>
            <td style="font-size:12px;line-height:1.5;color:#8a939e;padding-top:24px;border-top:1px solid #e8edf2;">
              <a href="{{ site_url }}" style="color:#c8102e;text-decoration:none;">{{ site_url }}</a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
