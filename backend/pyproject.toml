[project]
name = "hoocon-cms"
version = "0.1.0"
description = "B2B CMS and catalog for Hoocon HVAC actuators (Django + DRF)"
license = "Proprietary"
authors = [{ name = "niko" }]
requires-python = ">=3.12,<3.14"
dependencies = [
    "django (>=6.0.6,<7)",
    "djangorestframework (>=3.15,<4)",
    "python-dotenv (>=1.0,<2)",
    "psycopg[binary] (>=3.2,<4)",
    "pillow (>=12.2,<13)",
    "django-filter (>=24.0,<26)",
    "django-cors-headers (>=4.6,<5)",
    "drf-spectacular (>=0.28,<1)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)",
    "whitenoise (>=6.6,<7)",
    "gunicorn (>=23.0,<24)",
    "django-axes (>=8.3.1,<9.0.0)",
    "django-unfold (>=0.101.0,<0.102.0)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.15.0,<0.16.0)",
    "mypy (>=1.19.0,<1.20.0)",
    "pytest (>=9.0.0,<10.0.0)",
    "pytest-django (>=4.12.0,<5.0.0)",
    "django-stubs (>=5.2.0,<6.0.0)",
    "djangorestframework-stubs (>=3.15.0,<4.0.0)",
    "pytest-cov (>=6.0,<7)",
    "pip-audit (>=2.7,<3)",
]

[tool.ruff]
line-length = 119
target-version = "py313"
exclude = [
    ".venv",
    "*/migrations/*",
    "_*/**",
]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.13"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = [
    "^\\.venv/",
    "(^|/)_[^/]+/",
    "/migrations/",
]

[[tool.mypy.overrides]]
module = "*.management.commands.*"
disallow_untyped_defs = false
disable_error_code = ["attr-defined", "arg-type", "var-annotated"]

[[tool.mypy.overrides]]
module = "catalog.etl.*"
disable_error_code = ["attr-defined", "arg-type"]

# Admin mixin/actions typing vs django-stubs ModelAdmin is noisy.
[[tool.mypy.overrides]]
module = [
    "content.admin",
    "social.admin",
]
disable_error_code = ["misc", "assignment", "attr-defined"]

# DRF ModelSerializer Meta.fields length + django-stubs _ST on get_* methods.
[[tool.mypy.overrides]]
module = [
    "catalog.serializers",
    "content.serializers",
]
disable_error_code = ["assignment", "attr-defined", "return-value"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
norecursedirs = [
    "*.egg",
    ".*",
    "_darcs",
    "build",
    "CVS",
    "dist",
    "node_modules",
    "venv",
    "{arch}",
]
python_files = ["tests.py", "test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers"

[tool.coverage.run]
branch = true
source = ["catalog", "content", "leads", "crm", "search", "config", "sitesettings"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/management/commands/*",
    "manage.py",
    "**/asgi.py",
    "**/wsgi.py",
]

[tool.coverage.report]
precision = 1
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
]
