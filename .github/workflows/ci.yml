# CI/CD: check (pytest + lint) → build (GHCR + frontend) → deploy SSH.
#
# Public repo: GH-hosted minutes free; CI pacing: _docs/actions-minutes.md
#
# Optimizations vs linear test→lint→build→deploy:
#   - one Python install (merged check job)
#   - skip workflow when only _docs/rules change (paths-ignore)
#   - PR: check only — no image build / deploy
#   - push develop: check + build (verify) — deploy via main or manual
#   - push main: check + build + deploy
#   - GHCR buildcache for Docker layers
#
# Spec: _docs/infra-reg-ru.md; ПЛАН §6 Iter 5 CI+deploy.
name: Hoocon CI/CD

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "_docs/**"
      - ".cursor/**"
      - "_manuals-ru/**"
      - "_инструкции-pdf/**"
      - "_Универсальная-база-знаний/**"
      - "agent-transcripts/**"
  pull_request:
    branches: [develop, main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "_docs/**"
      - ".cursor/**"
      - "_manuals-ru/**"
      - "_инструкции-pdf/**"
      - "_Универсальная-база-знаний/**"
      - "agent-transcripts/**"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Run deploy job after build (push to main only by default)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"
  POETRY_VERSION: "2.2.1"
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  check:
    name: check (pytest + lint)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hoocon
          POSTGRES_PASSWORD: ci-db-password
          POSTGRES_DB: hoocon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hoocon -d hoocon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DJANGO_DEBUG: "false"
      DB_NAME: hoocon_test
      DB_USER: hoocon
      DB_PASSWORD: ci-db-password
      DB_HOST: localhost
      DB_PORT: "5432"
      CELERY_TASK_ALWAYS_EAGER: "true"
      USE_SQLITE: "False"
      DJANGO_CACHE_URL: "locmem://"
      DJANGO_SECURE_SSL_REDIRECT: "false"
      DJANGO_BEHIND_HTTPS_PROXY: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: snok/install-poetry@v1
        with:
          version: ${{ env.POETRY_VERSION }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pypoetry
            ~/.cache/pip
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}
      - run: poetry install --with dev
      - run: poetry run python manage.py migrate --noinput
      - run: poetry run pytest -q --cov --cov-fail-under=90
      - run: poetry run ruff check .
      - run: poetry run ruff format --check .
      - run: poetry run mypy config manage.py
      - name: pip-audit (supply chain)
        run: poetry run pip-audit --strict
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci
        working-directory: frontend
        run: npm ci
      # Split so severity maps to actual exposure. Advisories in build tooling
      # (eslint, openapi-typescript, vite-plugin-pwa) never reach a visitor, so
      # they must not gate CD; anything in the shipped bundle must. One blanket
      # continue-on-error step hid a high glob DoS behind a green job for months.
      - name: npm audit (runtime deps, blocking)
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
      - name: npm audit (build tooling, advisory only)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high

  build:
    name: build (image + frontend)
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Set image tags
        id: meta
        run: |
          IMAGE="${{ env.REGISTRY }}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "tag_sha=${IMAGE}:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "tag_latest=${IMAGE}:latest" >> "$GITHUB_OUTPUT"
          echo "cache=${IMAGE}:buildcache" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ steps.meta.outputs.tag_sha }}
            ${{ steps.meta.outputs.tag_latest }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.cache }},mode=max
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  deploy:
    name: deploy (SSH → VPS)
    runs-on: ubuntu-latest
    needs: build
    if: >-
      needs.build.result == 'success' &&
      (
        (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
        (github.event_name == 'workflow_dispatch' && inputs.deploy == true)
      )
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: Verify deploy secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          test -n "${SSH_PRIVATE_KEY}" || (echo "Missing SSH_PRIVATE_KEY" && exit 1)
          test -n "${SSH_USER}" || (echo "Missing SSH_USER" && exit 1)
          test -n "${SERVER_HOST}" || (echo "Missing SERVER_HOST" && exit 1)
          test -n "${DEPLOY_PATH}" || (echo "Missing DEPLOY_PATH" && exit 1)
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Deploy to VPS
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DOCKER_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GHCR image names are lowercase
          export DOCKER_IMAGE
          DOCKER_IMAGE="$(echo "${DOCKER_IMAGE}" | tr '[:upper:]' '[:lower:]')"
          chmod +x scripts/deploy-remote.sh
          ./scripts/deploy-remote.sh
      - name: Smoke health via SERVER_HOST
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
        run: |
          ok=0
          for i in 1 2 3 4 5 6; do
            if curl -fsS "http://${SERVER_HOST}/api/health/"; then
              echo
              ok=1
              break
            fi
            sleep 5
          done
          if [[ "${ok}" -ne 1 ]]; then
            echo "Smoke failed: /api/health/" >&2
            exit 1
          fi
          for i in 1 2 3 4 5 6; do
            if curl -fsS --http1.1 "http://${SERVER_HOST}/" | grep -q '<div id="root">'; then
              echo "SPA GET ok"
              exit 0
            fi
            sleep 5
          done
          echo "Smoke failed: GET / (SPA HTML body)" >&2
          exit 1
