<!doctype html>
<html lang="ru-RU">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("hoocon-theme");
          var pref =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved =
            pref === "dark" || (pref === "system" && systemDark) ? "dark" : "light";
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.dataset.themePreference = pref;
          root.style.colorScheme = resolved;
        } catch (e) {
          /* private mode / blocked storage */
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260725b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#dc1313" />
    <!-- theme-color hex = styles/brandColors.ts COLOR_BRAND / tokens --color-brand -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Hoocon — электроприводы ОВК</title>
    <meta
      name="description"
      content="Производство электроприводов для вентиляции, кондиционирования и противопожарных систем."
    />
    <link rel="canonical" href="https://hoocon.ru/" />
    <meta property="og:title" content="Hoocon — электроприводы ОВК" />
    <meta
      property="og:description"
      content="Производство электроприводов для вентиляции, кондиционирования и противопожарных систем."
    />
    <meta property="og:url" content="https://hoocon.ru/" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://hoocon.ru/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Hoocon — электроприводы ОВК" />
    <meta
      name="twitter:description"
      content="Производство электроприводов для вентиляции, кондиционирования и противопожарных систем."
    />
    <meta name="twitter:image" content="https://hoocon.ru/og-image.svg" />
    <meta name="robots" content="index, follow" />
    <!-- Shell paint before async entry CSS (media=print → all in main.tsx). -->
    <style id="hoocon-critical">
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f3f4f7;
        color: #2a2a2a;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #0f0f0f;
        color: #e8e8ec;
      }
      #root {
        min-height: 100vh;
      }
      /* Boot splash: mobile / PWA only (≤960px; desktop skips). */
      #hoocon-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        background: #f3f4f7;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      @media (min-width: 961px) {
        #hoocon-splash {
          display: none !important;
        }
      }
      html[data-theme="dark"] #hoocon-splash {
        background: #0f0f0f;
      }
      #hoocon-splash[data-done] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #hoocon-splash .hoocon-splash-logo {
        display: block;
        width: min(200px, 56vw);
        height: auto;
      }
      #hoocon-splash .hoocon-splash-logo--dark {
        display: none;
      }
      html[data-theme="dark"] #hoocon-splash .hoocon-splash-logo--light {
        display: none;
      }
      html[data-theme="dark"] #hoocon-splash .hoocon-splash-logo--dark {
        display: block;
      }
      @media (prefers-reduced-motion: no-preference) {
        #hoocon-splash .hoocon-splash-logo {
          animation: hoocon-splash-pulse 1.4s ease-in-out infinite;
        }
      }
      @keyframes hoocon-splash-pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.72;
        }
      }
    </style>
  </head>
  <body>
    <div
      id="hoocon-splash"
      role="status"
      aria-live="polite"
      aria-busy="true"
      aria-label="Загрузка Hoocon"
    >
      <img
        class="hoocon-splash-logo hoocon-splash-logo--light"
        src="/logo.svg"
        alt="Hoocon"
        width="200"
        height="54"
        decoding="async"
        fetchpriority="high"
      />
      <img
        class="hoocon-splash-logo hoocon-splash-logo--dark"
        src="/logo-on-dark.svg"
        alt=""
        width="200"
        height="54"
        decoding="async"
        aria-hidden="true"
      />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
