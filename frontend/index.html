<!doctype html>
<html lang="ru-RU">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("hoocon-theme");
          var pref =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved =
            pref === "dark" || (pref === "system" && systemDark) ? "dark" : "light";
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.dataset.themePreference = pref;
          root.style.colorScheme = resolved;
        } catch (e) {
          /* private mode / blocked storage */
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260725b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#da0e2b" />
    <!-- theme-color hex = styles/brandColors.ts COLOR_BRAND / tokens --color-brand -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
