<!doctype html>
<html lang="ru-RU">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("hoocon-theme");
          var pref =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system";
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var resolved =
            pref === "dark" || (pref === "system" && systemDark) ? "dark" : "light";
          var root = document.documentElement;
          root.dataset.theme = resolved;
          root.dataset.themePreference = pref;
          root.style.colorScheme = resolved;
        } catch (e) {
          /* private mode / blocked storage */
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260725b" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#da0e2b" />
    <!-- theme-color hex = styles/brandColors.ts COLOR_BRAND / tokens --color-brand -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Hoocon — электроприводы вентиляции и кондиционирования</title>
    <meta
      name="description"
      content="Электроприводы для вентиляции и ОВК. Подбор модели за минуту на главной, каталог по параметрам, паспорта PDF, аналоги Belimo, запрос КП."
    />
    <link rel="canonical" href="https://hoocon.ru/" />
    <meta
      property="og:title"
      content="Hoocon — электроприводы вентиляции и кондиционирования"

    <!-- Shell paint before async entry CSS (media=print → all in main.tsx). -->
    <style id="hoocon-critical">
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #f3f4f7;
        color: #2a2a2a;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #0f0f0f;
        color: #e8e8ec;
      }
      #root {
        min-height: 100vh;
      }
      /* Server article (spa_index) is the visible page until the SPA paints
         a real heading and removes it. #root is clipped only while that
         article is the previous sibling — Vite dev has no article. */
      #seo-crawl {
        box-sizing: border-box;
        max-width: 40rem;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 2.5rem;
        overflow-wrap: anywhere;
      }
      #seo-crawl h1 {
        font-size: 1.75rem;
        line-height: 1.2;
        margin: 0 0 0.75rem;
      }
      #seo-crawl ul {
        margin: 0 0 1rem;
        padding-left: 1.25rem;
      }
      #seo-crawl nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem 1rem;
      }
      #seo-crawl a {
        color: #da0e2b;
      }
      #seo-crawl ~ #root {
        position: absolute;
        width: 1px;
        height: 1px;
        min-height: 0;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        clip-path: inset(50%);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
